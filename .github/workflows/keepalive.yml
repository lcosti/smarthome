name: keepalive

# The Supabase free tier pauses a project after seven idle days. Ping every two
# days so a quiet week never takes the app down.
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping the keepalive function
        env:
          KEEPALIVE_URL: ${{ secrets.SUPABASE_KEEPALIVE_URL }}
        run: |
          if [ -z "$KEEPALIVE_URL" ]; then
            echo "SUPABASE_KEEPALIVE_URL is not set; nothing to ping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 "$KEEPALIVE_URL"
