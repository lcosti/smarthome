name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The acceptance run stubs the Edge Function at the network seam and never
      # compiles it, so without this a syntax error in it would ship green. Run
      # from the functions directory: deno discovers its deno.json from the cwd,
      # and from the repo root it would resolve npm: imports against the app's
      # node_modules instead.
      - name: Typecheck the Edge Function
        working-directory: supabase/functions
        run: deno check import-recipe-photo/index.ts

      - name: Test
        run: pnpm run test

  # The CLAUDE.md guarantee, enforced: airplane mode, reopen from the home
  # screen, nothing lost — plus the Phase 2 chain from recipe to list. Runs
  # against a real local Supabase stack; its keys are fixed demo values read
  # from `supabase status`, so no repository secrets are involved.
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start supabase
        run: supabase start -x studio,imgproxy

      - name: Export the local stack's keys
        run: |
          set -euo pipefail
          # Depending on CLI version, -o json is one line or pretty-printed, and
          # human-readable noise can precede it. Keep everything from the first
          # brace and let jq do the rest.
          STATUS_JSON="$(supabase status -o json | sed -n '/{/,$p')"
          SUPABASE_URL="$(jq -r '.API_URL // empty' <<<"$STATUS_JSON")"
          SUPABASE_KEY="$(jq -r '.PUBLISHABLE_KEY // empty' <<<"$STATUS_JSON")"
          SUPABASE_SECRET_KEY="$(jq -r '.SECRET_KEY // empty' <<<"$STATUS_JSON")"
          # Fail here, loudly, rather than three steps later with a blank env.
          test -n "$SUPABASE_URL" -a -n "$SUPABASE_KEY" -a -n "$SUPABASE_SECRET_KEY"
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_KEY=$SUPABASE_KEY"
            echo "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY"
          } >> "$GITHUB_ENV"

      - name: Install a browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the production bundle
        run: pnpm run generate

      - name: Offline acceptance
        run: pnpm run acceptance

      - name: Phase 2 acceptance
        run: pnpm run acceptance:phase2

      - name: Phase 3 acceptance
        run: pnpm run acceptance:phase3

      # The Edge Function is stubbed at the network seam, so this needs no
      # Anthropic key — it proves everything the client owns.
      - name: Phase 4 acceptance
        run: pnpm run acceptance:phase4

      - name: Roster acceptance
        run: pnpm run acceptance:roster

      - name: Generator acceptance
        run: pnpm run acceptance:generator
